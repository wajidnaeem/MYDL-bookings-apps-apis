<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MYDL Admin</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f3f6f5; color: #13242b; }
    header, main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    h2 { font-size: 20px; margin: 28px 0 10px; }
    [hidden] { display: none !important; }
    form, .table-wrap { background: #fff; border: 1px solid #d7e0de; border-radius: 12px; }
    form { padding: 16px; display: grid; gap: 10px; max-width: 420px; }
    .table-wrap { overflow: auto; }
    input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #d7e0de; }
    button { background: #0c6b63; color: #fff; border: 0; cursor: pointer; }
    .bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .bar button { background: #fff; color: #0c6b63; border: 1px solid #0c6b63; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #d7e0de; font-size: 14px; vertical-align: top; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .card { background: #fff; border: 1px solid #d7e0de; border-radius: 12px; padding: 14px; }
    .card b { display: block; font-size: 24px; }
    .error { color: #a3262a; }
    a { color: #0c6b63; }
  </style>
</head>
<body>
  <header>
    <h1>MYDL Admin</h1>
    <p>Users, visits, payments, disputes, and the activity log.</p>
  </header>
  <main>
    <form id="login">
      <label>Email <input id="email" value="admin@mydl.app" autocomplete="username" /></label>
      <label>Password <input id="password" type="password" value="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
    <section id="app" hidden>
      <div class="bar"><button id="sign-out" type="button">Sign out</button></div>
      <div class="cards" id="summary"></div>
      <h2>Users</h2>
      <div class="table-wrap"><table id="users"></table></div>
      <h2>Visits</h2>
      <div class="table-wrap"><table id="visits"></table></div>
      <h2>Disputes</h2>
      <div class="table-wrap"><table id="disputes"></table></div>
      <h2>Activity</h2>
      <div class="table-wrap"><table id="audit"></table></div>
    </section>
  </main>
  <script>
    const tokenKey = 'mydl-admin-token';
    let token = sessionStorage.getItem(tokenKey) || '';
    const login = document.querySelector('#login');
    const app = document.querySelector('#app');

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || 'Request failed');
      return body;
    }

    function table(id, headers, rows) {
      const head = '<tr>' + headers.map((item) => '<th>' + item + '</th>').join('') + '</tr>';
      const body = rows.map((row) => '<tr>' + row.map((cell) => '<td>' + cell + '</td>').join('') + '</tr>').join('');
      document.querySelector(id).innerHTML = head + body;
    }

    async function load() {
      const [summary, users, visits, disputes, audit] = await Promise.all([
        api('/admin/summary'),
        api('/admin/users'),
        api('/admin/appointments'),
        api('/admin/disputes'),
        api('/admin/audit'),
      ]);
      const labels = { users: 'Users', clients: 'Clients', providers: 'Providers', appointments: 'Visits', upcoming: 'Upcoming', cancelled: 'Cancelled', disputes: 'Disputes', openDisputes: 'Open disputes' };
      document.querySelector('#summary').innerHTML = Object.entries(summary).map(([key, value]) => '<div class="card"><span>' + (labels[key] || key) + '</span><b>' + value + '</b></div>').join('');
      table('#users', ['Role', 'Name', 'Email', 'Phone'], users.users.map((item) => [item.role, item.name, item.email, item.phone]));
      table('#visits', ['Provider', 'Service', 'When', 'Deposit', 'Status'], visits.appointments.map((item) => [item.provider, item.service, item.date + ' ' + item.time, item.deposit, item.status]));
      table('#disputes', ['Title', 'Status', 'Evidence', 'Decision'], disputes.disputes.map((item) => [
        item.title,
        item.status,
        item.evidence && String(item.evidence).indexOf('/evidence/') === 0 ? '<button type="button" data-file="' + item.evidence + '">Open file</button>' : '',
        '<select data-id="' + item.id + '">' + ['In review', 'Refunded', 'Released'].map((status) => '<option' + (status === item.status ? ' selected' : '') + '>' + status + '</option>').join('') + '</select>',
      ]));
      table('#audit', ['When', 'Action', 'Detail'], audit.audit.map((item) => [new Date(item.created_at).toLocaleString(), item.action, item.detail]));
      document.querySelectorAll('#disputes button[data-file]').forEach((button) => {
        button.onclick = async () => {
          const response = await fetch(button.dataset.file, { headers: { Authorization: 'Bearer ' + token } });
          if (!response.ok) return;
          window.open(URL.createObjectURL(await response.blob()));
        };
      });
      document.querySelectorAll('#disputes select').forEach((select) => {
        select.onchange = async () => {
          await api('/admin/disputes/' + select.dataset.id, { method: 'PATCH', body: JSON.stringify({ status: select.value }) });
          await load();
        };
      });
    }

    login.onsubmit = async (event) => {
      event.preventDefault();
      document.querySelector('#login-error').textContent = '';
      try {
        const result = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value, password: password.value }),
        }).then((response) => response.json());
        if (!result.token || result.user?.role !== 'admin') throw new Error(result.error || 'Use the admin account.');
        token = result.token;
        sessionStorage.setItem(tokenKey, token);
        login.hidden = true;
        app.hidden = false;
        await load();
      } catch (error) {
        document.querySelector('#login-error').textContent = error.message;
      }
    };

    document.querySelector('#sign-out').onclick = () => {
      token = '';
      sessionStorage.removeItem(tokenKey);
      login.hidden = false;
      app.hidden = true;
    };

    if (token) {
      login.hidden = true;
      app.hidden = false;
      load().catch(() => { token = ''; sessionStorage.removeItem(tokenKey); login.hidden = false; app.hidden = true; });
    }
  </script>
</body>
</html>
